name: Monthly runtime updates

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
      UPDATE_BRANCH: automation/copilot-api-update
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check for a validated owned proxy release
        id: version
        shell: pwsh
        run: |
          $source = Get-Content install.ps1 -Raw
          $match = [regex]::Match($source, 'gc2cc-v(?<version>\d+\.\d+\.\d+-gc2cc\.\d+)')
          if (-not $match.Success) { throw 'Unable to find the pinned copilot-api version.' }
          $current = $match.Groups['version'].Value
          $release = gh api repos/escapecat/copilot-api/releases/latest | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -notmatch '^gc2cc-v(\d+\.\d+\.\d+-gc2cc\.\d+)$') { throw 'No validated owned proxy release found' }
          $latest = $Matches[1]
          $assetName = "jeffreycao-copilot-api-$latest.tgz"
          $asset = $release.assets | Where-Object name -eq $assetName
          if (-not $asset -or -not ($release.assets | Where-Object name -eq "$assetName.sha256")) { throw 'Owned package or digest asset missing' }
          if ($asset.digest -notmatch '^sha256:([a-fA-F0-9]{64})$') { throw 'Invalid owned package digest' }
          "digest=$($Matches[1].ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "current=$current" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT
          $available = ([version]($latest.Replace('-gc2cc.', '.')) -gt [version]($current.Replace('-gc2cc.', '.'))).ToString().ToLowerInvariant()
          "available=$available" >> $env:GITHUB_OUTPUT

      - name: Update the pinned version
        if: steps.version.outputs.available == 'true'
        shell: pwsh
        run: |
          $current = '${{ steps.version.outputs.current }}'
          $latest = '${{ steps.version.outputs.latest }}'
          foreach ($path in @('install.ps1', 'README.md')) {
            $source = Get-Content $path -Raw
            $updated = $source.Replace($current, $latest)
            if ($path -eq 'install.ps1') {
              $updated = [regex]::Replace($updated, "(\`$ProxyPackageSha256\s*=\s*')[a-fA-F0-9]{64}(')", ('${1}' + '${{ steps.version.outputs.digest }}' + '${2}'))
            }
            if ($updated -eq $source) { throw "Expected version reference was not found in $path" }
            [IO.File]::WriteAllText((Resolve-Path $path), $updated, [Text.UTF8Encoding]::new($false))
          }

      - name: Run offline smoke tests
        if: steps.version.outputs.available == 'true'
        shell: pwsh
        run: |
          ./tests/install-package-smoke.ps1
          ./tests/owned-proxy-package-smoke.ps1
          ./tests/monthly-owned-release-smoke.ps1
          ./tests/nssm-configuration-smoke.ps1

      - name: Create or update pull request
        if: steps.version.outputs.available == 'true'
        shell: pwsh
        run: |
          $current = '${{ steps.version.outputs.current }}'
          $latest = '${{ steps.version.outputs.latest }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $env:UPDATE_BRANCH
          git add install.ps1 README.md
          git commit -m "chore: update copilot-api to $latest"
          git push --force-with-lease origin "HEAD:$env:UPDATE_BRANCH"

          $number = gh pr list --head $env:UPDATE_BRANCH --base main --state open --json number --jq '.[0].number'
          if (-not $number) {
            $body = @"
          ## Summary
          - update the pinned copilot-api package from $current to $latest
          - install an immutable owned GitHub release and pin its SHA-256

          ## Automated validation
          - install package smoke test
          - owned proxy origin, integrity, and cache tests
          - NSSM configuration smoke test

          ## Manual validation required before merge
          - isolated proxy install and service restart
          - Codex Responses, tools, images, and session resume
          - Mori app-server start and resume
          "@
            gh pr create --base main --head $env:UPDATE_BRANCH `
              --title "chore: update copilot-api to $latest" `
              --body $body
            $number = gh pr list --head $env:UPDATE_BRANCH --base main --state open --json number --jq '.[0].number'
          }

          @{ reviewers = @('escapecat') } | ConvertTo-Json -Compress |
            gh api "repos/${{ github.repository }}/pulls/$number/requested_reviewers" `
              --method POST --input -

  codex-update:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
      UPDATE_BRANCH: automation/codex-update
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check for a stable Codex update
        id: version
        shell: pwsh
        run: |
          $source = Get-Content install.ps1 -Raw
          $match = [regex]::Match($source, '@openai/codex@(?<version>\d+\.\d+\.\d+)')
          if (-not $match.Success) { throw 'Unable to find the pinned Codex version.' }
          $current = $match.Groups['version'].Value
          $versions = @(& npm view '@openai/codex' versions --json --registry $env:NPM_REGISTRY | ConvertFrom-Json)
          $stable = @($versions | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | ForEach-Object { [version]$_ })
          if (-not $stable) { throw 'The Microsoft npm proxy returned no stable Codex versions.' }
          $latest = [string]($stable | Sort-Object -Descending | Select-Object -First 1)
          "current=$current" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT
          $available = ([version]$latest -gt [version]$current).ToString().ToLowerInvariant()
          "available=$available" >> $env:GITHUB_OUTPUT

      - name: Update the pinned Codex version
        if: steps.version.outputs.available == 'true'
        shell: pwsh
        run: |
          $current = '${{ steps.version.outputs.current }}'
          $latest = '${{ steps.version.outputs.latest }}'
          foreach ($path in @('install.ps1', 'README.md', 'tests/install-package-smoke.ps1')) {
            $source = Get-Content $path -Raw
            $updated = $source.Replace("@openai/codex@$current", "@openai/codex@$latest")
            if ($updated -eq $source) { throw "Expected Codex version reference was not found in $path" }
            [IO.File]::WriteAllText((Resolve-Path $path), $updated, [Text.UTF8Encoding]::new($false))
          }

      - name: Run offline smoke tests
        if: steps.version.outputs.available == 'true'
        shell: pwsh
        run: |
          ./tests/install-package-smoke.ps1
          ./tests/nssm-configuration-smoke.ps1
          ./tests/runtime-updater-smoke.ps1

      - name: Create or update Codex pull request
        if: steps.version.outputs.available == 'true'
        shell: pwsh
        run: |
          $current = '${{ steps.version.outputs.current }}'
          $latest = '${{ steps.version.outputs.latest }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B $env:UPDATE_BRANCH
          git add install.ps1 README.md tests/install-package-smoke.ps1
          git commit -m "chore: update Codex to $latest"
          git push --force-with-lease origin "HEAD:$env:UPDATE_BRANCH"
          $number = gh pr list --head $env:UPDATE_BRANCH --base main --state open --json number --jq '.[0].number'
          if (-not $number) {
            gh pr create --base main --head $env:UPDATE_BRANCH `
              --title "chore: update Codex to $latest" `
              --body "Update the pinned stable Codex CLI from $current to $latest. Offline installer tests passed; Mori app-server, tools, images, resume, and MultiAgent require staging before merge."
            $number = gh pr list --head $env:UPDATE_BRANCH --base main --state open --json number --jq '.[0].number'
          }
          @{ reviewers = @('escapecat') } | ConvertTo-Json -Compress |
            gh api "repos/${{ github.repository }}/pulls/$number/requested_reviewers" `
              --method POST --input -
